# Gateway: satu pintu masuk untuk semua service di STB.
# cloudflared -> gateway:80 -> core-service:3000
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream core_service {
    server core-service:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100k;

    # Header asli dari Cloudflare diteruskan ke service
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location = / {
        proxy_pass http://core_service;
    }

    location = /gateway-health {
        default_type application/json;
        return 200 '{"gateway":"ok"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Gunakan prefix /api"}}';
    }
}
